<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Design Configurator</title><!-- STYLE --></head><body>
<header class="tool-header"><div class="tool-brand"><span id="brand" aria-hidden="true">◧</span><div><strong id="project-name"></strong><small>Design Configurator · студия решений</small></div></div><div class="actions"><button id="tool-theme">Тёмная</button><button id="import">Импорт JSON</button><input type="file" id="import-file" accept=".json,application/json" hidden><button id="reset">Сбросить</button><button id="export" class="primary">Экспорт выбора ↗</button></div></header>
<nav class="mobile-switch" aria-label="Панель конфигуратора"><button data-surface="controls" aria-pressed="true">Решения</button><button data-surface="preview" aria-pressed="false">Макет</button></nav><p id="mobile-status" role="status"></p>
<main class="workspace"><aside class="picker"><section class="presets"><h1>Направления</h1><div id="presets"></div><p id="preset-status"></p></section><div id="decisions"></div></aside><div id="splitter" role="separator" tabindex="0" aria-label="Ширина панели решений" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="800" aria-valuenow="440"><span></span></div><section class="preview-pane"><div class="preview-toolbar"><div class="segmented"><button data-compare="before" aria-pressed="false">Было</button><button data-compare="after" aria-pressed="true">Стало</button></div><select id="section-jump" aria-label="Перейти к блоку"></select><div class="segmented devices"><button data-device="desktop" aria-pressed="true">Desktop</button><button data-device="mobile" aria-pressed="false">Mobile</button></div><button id="expand" aria-label="Расширить макет">↗</button></div><div class="zoom-toolbar"><label for="zoom">Масштаб сайта</label><input id="zoom" type="range" min="5" max="150" step="1" value="100"><output id="zoom-value">100%</output><button id="fit-width">По ширине</button><button id="fit-page">Весь сайт</button></div><div id="frame-well"><div id="frame-sizer"><iframe id="preview" title="Превью проекта" sandbox="allow-scripts allow-popups"></iframe></div></div><div class="context"><span id="context-text" role="status">Выберите направление или отдельное решение</span><span id="preview-label"></span></div></section></main>
<dialog id="export-dialog"><header><h2>Экспорт выбора</h2><button data-close>Закрыть</button></header><p>Экспортируется текущий выбор, даже если в превью открыто «Было»</p><div class="segmented"><button data-format="brief" aria-pressed="true">Спецификация</button><button data-format="json" aria-pressed="false">JSON</button></div><textarea id="export-content" readonly aria-label="Выбранная конфигурация"></textarea><div class="actions"><button id="copy" class="primary">Копировать</button><button id="download-json">JSON</button><button id="download-txt">TXT</button><button id="download-html">Сайт HTML</button></div><p id="copy-status" role="status"></p></dialog>
<!-- SCRIPT --></body></html>
